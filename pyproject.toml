[project]
name = "agent-forge"
version = "1.0.0"
description = "Safe client deployment automation for Agent Forge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60.0",
    "chromadb>=0.5.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
    "types-pyyaml>=6.0.0",
    "pip-tools>=7.3.0",
]

[project.scripts]
agent-forge = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "adapters*", "agents*", "orchestrator*", "shared*", "scripts*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for deterministic logic",
    "contract: Vendor API contract tests",
    "integration: Integration tests requiring external services",
    "staging: Tests against staging resources only",
    "security: Security and secret safety tests",
    "restoration: Export and restore validation tests",
    "failure_injection: Deliberate failure scenario tests",
    "regression: Regression tests for prompt and template stability",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "chroma_data",
    "backups",
    "outputs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# `with patch("...") as MockVapi:` is the conventional spelling for a patched
# class. Lowercasing these would obscure that the binding is a class, not an
# instance, so the naming rule is waived for tests rather than the names changed.
"tests/**" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "chromadb.*",
    "supabase.*",
]
ignore_missing_imports = true
