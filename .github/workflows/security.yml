name: Security Scan

on:
  pull_request:
    branches: [master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.82.13
        with:
          extra_args: --only-verified --results=verified,unknown --exclude-paths=.trufflehog.exclude
