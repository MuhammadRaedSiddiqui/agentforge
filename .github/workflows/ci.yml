name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Quoted, and pinned exactly. Unquoted, `>` is a shell redirect: the old
      # `pip install ruff>=0.1.0` wrote stdout to a file named `=0.1.0` and
      # installed whatever ruff was newest. Formatting output is version
      # specific, so a blocking format gate against a floating formatter fails
      # the moment upstream changes its mind. Bump this deliberately.
      - run: pip install "ruff==0.14.10"
      # The tree is clean, so both events lint everything. The old
      # changed-files-only path on PRs existed to avoid failing on the 114
      # pre-existing errors; that reason is gone, and linting only the diff
      # would miss an error introduced in a file the PR did not touch.
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt mypy types-requests types-pyyaml
      # No --ignore-missing-imports: pyproject lists the specific third-party
      # modules that ship no stubs, so a newly added untyped import surfaces
      # here instead of being silently waived for the whole tree.
      - name: Type check
        run: mypy adapters/ orchestrator/ shared/ agents/ cli/

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-timeout pytest-mock
      # Deselect by exclusion, not inclusion: a new test file that forgets its
      # marker is then RUN by default rather than silently skipped. The previous
      # `-m "unit or contract"` selected 166 of 640 tests for this reason.
      - run: pytest -m "not integration and not staging" --timeout=30 --tb=short -q
